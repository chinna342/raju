<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Webpage</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
            color: #f21717;
            max-width: 800px;
            margin-inline: auto;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f9fa;
        }
        button:hover {
            background-color: #e2e6ea;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>A clean, minimal starting template.</p>
    </header>

    <main>
        <h2>About This Page</h2>
        <p>This is a standard HTML5 template configured with mobile responsiveness, a clean font stack, and modern layout conventions.</p>
        
        <button id="alertBtn">Click Me</button>
    </main>

    <script>
        document.getElementById('alertBtn').addEventListener('click', () => {
            alert('Button clicked!');
        });
    </script>

</body>
</html>
